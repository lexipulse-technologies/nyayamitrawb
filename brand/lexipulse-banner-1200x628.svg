<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-label="LEXIPULSE TECHNOLOGIES corporate banner">
  <defs>
    <linearGradient id="badgeGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123961"/>
      <stop offset="100%" stop-color="#0f2b48"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#0f2b48" stroke-width="1" opacity="0.05"/>
    </pattern>
    <linearGradient id="amberArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="628" fill="#ffffff"/>
  <rect width="1200" height="628" fill="url(#grid)"/>

  <!-- Soft amber depth arc -->
  <path d="M0 560 Q 300 470 700 560 T 1200 520 L1200 628 L0 628 Z" fill="url(#amberArc)"/>

  <!-- Tricolor top rail -->
  <rect x="0" y="0" width="1200" height="10" fill="#f59e0b"/>
  <rect x="0" y="10" width="1200" height="4" fill="#ffffff"/>
  <rect x="0" y="14" width="1200" height="10" fill="#059669"/>

  <!-- Emblem -->
  <rect x="86" y="150" width="330" height="330" rx="72" fill="url(#badgeGradB)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M251 232 V418" stroke="#f59e0b" stroke-width="10"/>
    <circle cx="251" cy="224" r="11" fill="#f59e0b" stroke="none"/>
    <path d="M169 281 H333" stroke="#f59e0b" stroke-width="10"/>
    <path d="M169 281 V326" stroke="#f59e0b" stroke-width="7"/>
    <path d="M133 326 H205" stroke="#f59e0b" stroke-width="8"/>
    <path d="M137 326 Q169 363 201 326" stroke="#f59e0b" stroke-width="8"/>
    <path d="M333 281 V326" stroke="#f59e0b" stroke-width="7"/>
    <path d="M297 326 H369" stroke="#f59e0b" stroke-width="8"/>
    <path d="M301 326 Q333 363 365 326" stroke="#f59e0b" stroke-width="8"/>
    <path d="M118 432 H368 L424 388" stroke="#10b981" stroke-width="12"/>
    <path d="M424 388 L462 432" stroke="#10b981" stroke-width="12"/>
  </g>

  <!-- Wordmark -->
  <text x="500" y="300"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        font-size="96" font-weight="800" letter-spacing="5" fill="#0f2b48">LEXIPULSE</text>

  <text x="504" y="362"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        font-size="34" font-weight="700" letter-spacing="16" fill="#059669">TECHNOLOGIES</text>

  <!-- Amber accent -->
  <rect x="504" y="398" width="250" height="8" rx="4" fill="#f59e0b"/>

  <!-- Tagline -->
  <text x="504" y="452"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        font-size="25" font-weight="600" fill="#334155">Civil Legal Technology &#8226; West Bengal, India</text>
</svg>
